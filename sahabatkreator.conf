# ============================================================================
# Sahabat Kreator — NGINX host-level reverse proxy + SSL Cloudflare Origin
#
# Pasang di server:
#   sudo cp sahabatkreator.conf /etc/nginx/conf.d/sahabatkreator.conf
#   sudo mkdir -p /etc/nginx/ssl
#   sudo cp origin.crt origin.key /etc/nginx/ssl/
#   sudo chmod 600 /etc/nginx/ssl/origin.key
#   sudo nginx -t && sudo systemctl reload nginx
#
# PENTING — file ini di-include dari konteks `http` (conf.d). Konfigurasi
# aplikasi lain (mis. toeflynk) sudah ada di server yang sama, jadi:
#   • set_real_ip_from bersifat kumulatif → aman dideklarasikan di sini.
#   • real_ip_header HANYA dideklarasikan di dalam server block (bukan di
#     level http) agar tidak bertabrakan "directive is duplicate" dengan
#     konfigurasi lain.
#
# Alur: Cloudflare (proxy, SSL Full Strict) → nginx :443 (origin cert)
#       → produksi  127.0.0.1:3001 (docker sahabatkreator-app)
#       → staging   127.0.0.1:3002 (docker sahabatkreator-staging-app)
#
# Port 3000 dipakai aplikasi lain (toeflynk) — jangan diubah.
#
# Batas body request: lihat deploy/upload-body-limits.md (layer Cloudflare →
# nginx → Hono bodyLimit → route). client_max_body_size di sini HANYA pagar
# luar; pemisahan limit per-path ada di aplikasi (lib/body-limit.ts).
#
# MCP remote (`POST /mcp`): SENGAJA tidak punya location block sendiri —
# dilayani oleh `location /` yang sama dengan sisa aplikasi. Alasannya:
#   • Transport-nya stateless + `enableJsonResponse: true`, jadi balasannya
#     JSON biasa (bukan SSE). Tidak perlu `proxy_buffering off` — buffering
#     justru aman dan tidak menggantung seperti stream.
#   • GET/DELETE /mcp dibalas 405 oleh aplikasi, jadi tidak ada koneksi
#     long-lived yang perlu diakali.
#   • Body-nya JSON kecil (argumen tool), jauh di bawah client_max_body_size.
#   • Menambah location block BARU berbahaya di sini: `add_header` di dalam
#     location MENIMPA header level server — blok baru wajib mengulang
#     X-Robots-Tag staging & header keamanan, kalau lupa → noindex bocor.
#   Batas praktis: proxy_read_timeout 120s > timeout origin Cloudflare free
#   (~100s). Tool call yang butuh >100s akan diputus Cloudflare lebih dulu —
#   itu batas Cloudflare, bukan nginx. Lihat docs/mcp-remote.md.
#
# Catatan SEO:
#   • PROD  = indexable → TANPA X-Robots-Tag (meta robots per-halaman dari
#             web + robots.txt + sitemap.xml dari public/).
#   • STAGING = noindex → X-Robots-Tag always (lapisan ke-4 setelah vite
#             build guard, seo.ts runtime, dan middleware Hono).
#
# ⚠️ Jebakan nginx: `add_header` di dalam location MENIMPA add_header level
#   server (tidak diwariskan). Setiap location yang punya add_header-nya
#   sendiri WAJIB mengulang header keamanan / X-Robots-Tag.
# ============================================================================

# --- Cloudflare: pulihkan IP asli pengunjung ---------------------------------
# Kumulatif — aman walau konfigurasi lain juga menambahkannya.
# Perbarui daftar dari https://www.cloudflare.com/ips/ secara berkala.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# --- Upstream container Docker (port publish 127.0.0.1) -----------------------
upstream sahabatkreator_prod {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream sahabatkreator_staging {
    server 127.0.0.1:3002;
    keepalive 16;
}

# --- Cache-Control aset statis: hanya untuk balasan sukses ---------------------
# Blok `location ~* \.(css|js|png|svg|...)` mencocokkan URL ber-ekstensi aset
# apa pun — TERMASUK berkas yang tidak ada. Kalau 404 ikut dicap
# "immutable, max-age=2592000", Cloudflare menyimpannya di edge selama 30 hari
# dan aset itu 404 permanen bagi semua pengunjung hanya karena satu kali salah
# urutan deploy. Karena itu status diperiksa lebih dulu: 2xx/3xx boleh di-cache
# lama, sisanya no-store supaya CDN & browser selalu menanyakan ulang.
map $status $sk_asset_cache_control {
    default "no-store";
    ~^[23]  "public, max-age=2592000, immutable";
}

# --- Cache-Control aset statis STAGING: juga hanya untuk balasan sukses -------
# Alasannya sama dengan produksi (lihat map di atas). Di staging durasinya
# pendek (10 menit) karena aset sering berubah antar deploy, tetapi `add_header`
# dengan status apa pun tetap membuat 404 ikut tercap "public, max-age=600" —
# cukup untuk membuat satu kali salah urutan deploy tampak seperti aset rusak
# permanen saat menguji. Status diperiksa lebih dulu, sama seperti produksi.
map $status $sk_staging_asset_cache_control {
    default "no-store";
    ~^[23]  "public, max-age=600";
}

# --- HTTP :80 → HTTPS ---------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sahabatkreator.com www.sahabatkreator.com app.sahabatkreator.com;

    # Cloudflare "Always Use HTTPS" sebaiknya tetap dinyalakan; redirect ini
    # menjaga akses langsung ke IP server.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www → apex (satu canonical domain untuk SEO) ------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sahabatkreator.com;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sk_ssl:10m;
    ssl_session_timeout 1d;

    return 301 https://sahabatkreator.com$request_uri;
}

# --- PRODUKSI — sahabatkreator.com (INDEX GOOGLE) -----------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sahabatkreator.com;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sk_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # IP asli pengunjung dari Cloudflare — di-level server agar tidak
    # bertabrakan dengan real_ip_header milik konfigurasi lain.
    real_ip_header CF-Connecting-IP;

    # Upload media multipart — sama dengan limit layer aplikasi:
    #   • Hono bodyLimit (lib/body-limit.ts): 110MB hanya di route multipart
    #     (/api/media/upload, /api/sound/upload, /api/admin/holidays/import),
    #     10MB untuk semua route JSON lain.
    #   • Route media sendiri tolak file > 100MB (MAX_FILE_SIZE).
    # NGINX 50m dulu → upload video >50MB (biasa untuk klip) ditolak di sini
    # padahal aplikasi terima; sekarang 110m agar yang membatasi adalah layer
    # aplikasi (yang tahu path-nya), bukan proxy. Cloudflare free/pro tetap
    # membatasi ~100MB per request — itu di luar konfigurasi kita.
    client_max_body_size 110m;

    # Default client_body_timeout 60s antar-baca body. Upload video 100MB dari
    # jaringan mobil yang pelan/tersendat bisa melebihi itu → request dibatalkan
    # di tengah jalan tanpa pesan jelas. Longgarkan untuk upload besar.
    client_body_timeout 300s;

    # Header keamanan dasar. TIDAK ada X-Robots-Tag → Google boleh index.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json image/svg+xml;

    # Aset statis (JS/CSS Vite sudah hashed) — cache 30 hari.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpe?g|webp|avif|svg|ico|map)$ {
        proxy_pass http://sahabatkreator_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cache-Control dipilih lewat map $sk_asset_cache_control (lihat atas):
        # sukses → immutable 30 hari, gagal → no-store.
        add_header Cache-Control $sk_asset_cache_control always;
        # Ulangi header keamanan — add_header di location menimpa level server.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # robots.txt & sitemap — cache 1 jam agar crawl efisien.
    location = /robots.txt {
        proxy_pass http://sahabatkreator_prod;
        proxy_set_header Host $host;
        expires 1h;
    }
    location ~* ^/sitemap.*\.xml$ {
        proxy_pass http://sahabatkreator_prod;
        proxy_set_header Host $host;
        expires 1h;
    }

    location / {
        # Menangani seluruh aplikasi termasuk `POST /mcp` (MCP remote) dan
        # `/v1/*` — lihat catatan MCP di header file.
        proxy_pass http://sahabatkreator_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- STAGING — app.sahabatkreator.com (NOINDEX) --------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.sahabatkreator.com;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:sk_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    real_ip_header CF-Connecting-IP;

    # Sama dengan produksi — lihat catatan client_max_body_size di blok prod.
    client_max_body_size 110m;
    client_body_timeout 300s;

    # 🔒 Lapisan noindex ke-4 (setelah vite build guard, seo.ts runtime,
    # dan middleware Hono yang juga mengirim X-Robots-Tag).
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex" always;
    add_header X-Sahabat-Kreator-Env "staging" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/manifest+json image/svg+xml;

    # Aset statis — cache pendek (staging sering berubah antar deploy).
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpe?g|webp|avif|svg|ico|map)$ {
        proxy_pass http://sahabatkreator_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cache-Control dipilih lewat map $sk_staging_asset_cache_control
        # (lihat atas): sukses → 10 menit, gagal → no-store.
        add_header Cache-Control $sk_staging_asset_cache_control always;
        # Ulangi X-Robots-Tag — add_header di location menimpa level server.
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex" always;
        add_header X-Sahabat-Kreator-Env "staging" always;
        access_log off;
    }

    location / {
        # Sama dengan produksi: termasuk `POST /mcp`. Karena blok ini TIDAK
        # punya add_header sendiri, X-Robots-Tag staging tetap diwarisi dari
        # level server — jangan tambahkan add_header di sini tanpa mengulangnya.
        proxy_pass http://sahabatkreator_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
