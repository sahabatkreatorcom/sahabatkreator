# =============================================================================
# Sahabat Kreator — Production Docker Compose
# Domain: sahabatkreator.com
# Database: PostgreSQL di VPS
# Port: 3001 (web) → nginx reverse proxy
#
# Cara pakai:
#   cp .env.prod .env
#   nano .env  # isi credentials
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Port allocation (VPS):
#   toeflynk:  3000 (web), 5432 (postgres), 6379 (redis)
#   prod:      3001 (web), 5433 (postgres), 6380 (redis)
#   staging:   3002 (web), Neon (database)
# =============================================================================

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: sahabat-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahabat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahabat_password}
      POSTGRES_DB: ${POSTGRES_DB:-sahabat}
    volumes:
      - sahabat-prod-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahabat} -d ${POSTGRES_DB:-sahabat}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-prod:
    image: redis:7-alpine
    container_name: sahabat-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sahabat-prod-redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    container_name: sahabat-prod-migrate
    command: ["pnpm", "--filter", "@sahabat-kreator/db", "db:migrate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres-prod:
        condition: service_healthy
    restart: "no"

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CORS_ORIGIN: ${CORS_ORIGIN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY}
        R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
        R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
        R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
        R2_BUCKET_NAME: ${R2_BUCKET_NAME}
    container_name: sahabat-prod-web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis-prod:6379}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
      migrate-prod:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-prod:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sahabat-prod-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-15000}
      - WORKER_BATCH_SIZE=${WORKER_BATCH_SIZE:-1}
      - WORKER_FRAME_COUNT=${WORKER_FRAME_COUNT:-4}
      - WORKER_MAX_VIDEO_BYTES=${WORKER_MAX_VIDEO_BYTES:-104857600}
      - WORKER_ENABLE_TRANSCODE=${WORKER_ENABLE_TRANSCODE:-true}
      - TRANSCODER=${TRANSCODER:-local}
    restart: unless-stopped
    depends_on:
      postgres-prod:
        condition: service_healthy
      migrate-prod:
        condition: service_completed_successfully

volumes:
  sahabat-prod-postgres:
  sahabat-prod-redis:
