# Override untuk deployment dengan nginx (bukan Caddy).
# Digunakan dengan:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build
#
# Perubahan dari docker-compose.yml utama:
#   - caddy tidak dimuat (tidak ada profile "caddy" di command di atas)
#   - web di-expose ke 127.0.0.1:3000 agar nginx bisa proxy
#   - volume caddy di-drop (tidak dipakai)

services:
  web:
    ports:
      - "127.0.0.1:3000:3000"
