# Deploy VPS — postgres + web + worker media + Redis (job queue) + migrate.
# Penggunaan:
#   1. Salin .env.prod ke .env (isi POSTGRES_USER/PASSWORD/DB + DATABASE_URL).
#   2. docker compose build
#   3. docker compose up -d
#
# Catatan:
#   - DATABASE_URL menunjuk service `postgres` (tanpa sslmode):
#       postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
#   - Service `migrate` menjalankan migrasi Drizzle sekali sebelum web/worker start.
#   - Env build-time web (DATABASE_URL, BETTER_AUTH_*) wajib diset saat build.
#   - Redis opsional untuk BullMQ; kosongkan REDIS_URL bila tidak dipakai
#     (scheduling fallback ke cron DB polling).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahabat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahabat_password}
      POSTGRES_DB: ${POSTGRES_DB:-sahabat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahabat} -d ${POSTGRES_DB:-sahabat}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["pnpm", "--filter", "@sahabat-kreator/db", "db:migrate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CORS_ORIGIN: ${CORS_ORIGIN}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-10000}
      - WORKER_BATCH_SIZE=${WORKER_BATCH_SIZE:-3}
      - WORKER_FRAME_COUNT=${WORKER_FRAME_COUNT:-4}
      - WORKER_MAX_VIDEO_BYTES=${WORKER_MAX_VIDEO_BYTES:-104857600}
      - WORKER_ENABLE_TRANSCODE=${WORKER_ENABLE_TRANSCODE:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
