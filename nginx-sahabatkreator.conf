# =============================================================================
# Sahabat Kreator — Nginx Config (Production + Staging)
# Mode: Cloudflare Full/Full Strict SSL
# SSL: Cloudflare Origin Certificate
#
# Cara pakai:
#   1. Generate Cloudflare Origin Certificate di Dashboard
#   2. Copy origin.crt dan origin.key ke /etc/nginx/ssl/sahabatkreator/
#   3. Jalankan: sudo nginx -t && sudo systemctl reload nginx
#   4. Set Cloudflare SSL mode: Full atau Full Strict
#
# Port allocation (VPS):
#   toeflynk:  3000 (web)
#   prod:      3001 (web)
#   staging:   3002 (web)
# =============================================================================

# ─── Production: sahabatkreator.com ─────────────────────────────────────────
upstream sahabat-prod {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name sahabatkreator.com www.sahabatkreator.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sahabatkreator.com www.sahabatkreator.com;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/sahabatkreator/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sahabatkreator/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Trust Cloudflare IPs
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Timeout untuk SEB report generation
    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
    # Upload limit (media)
    client_max_body_size 100M;

    location / {
        proxy_pass http://sahabat-prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Staging: staging.sahabatkreator.com ────────────────────────────────────
upstream sahabat-staging {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    server_name staging.sahabatkreator.com;
    return 301 https://$host$request_uri;
